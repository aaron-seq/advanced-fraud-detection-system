name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch makes the previous run obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # Installed from requirements-dev.txt so CI lints with the exact
      # version developers run; a drifting pin means "clean locally" and
      # "clean in CI" stop meaning the same thing.
      - name: Install ruff
        run: pip install -r requirements-dev.txt

      # dashboard/ and scripts/ are linted too. They were excluded, and the
      # gap hid a dead page: dashboard/app.py called TemplateResponse with the
      # pre-0.29 argument order, so every load of the demo home page raised
      # TypeError. Shipped code that is never linted is shipped code nobody
      # checks.
      - name: Lint
        run: ruff check app/ src/ tests/ dashboard/ scripts/

      - name: Check formatting
        run: ruff format --check app/ src/ tests/ dashboard/ scripts/

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        # SECRET_KEY is set explicitly so the run does not depend on the
        # ephemeral development key. It must clear the 32-character floor the
        # settings validator enforces - the previous value was 31 and started
        # failing collection once that check existed, which is the check doing
        # its job on the first key it was pointed at.
        env:
          ENVIRONMENT: testing
          SECRET_KEY: ci-test-key-not-used-outside-ci-0123456789
        run: pytest --cov=app --cov=src --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install scanners
        run: pip install pip-audit ruff==0.16.0

      - name: Audit dependencies for known vulnerabilities
        run: pip-audit --requirement requirements.txt --strict

      - name: Static security checks
        run: ruff check --select S app/ src/ dashboard/ scripts/

  build:
    name: Package build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Build distribution
        run: |
          pip install build twine
          python -m build
          twine check dist/*
