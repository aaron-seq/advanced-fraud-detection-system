[pytest]
# Puts the repo root on sys.path so `app` and `src` import.
#
# `python -m pytest` adds the working directory implicitly, but a bare `pytest`
# does not - so without this, the suite passes locally and fails in CI with
# ModuleNotFoundError. Setting it here makes both invocations behave the same.
pythonpath = .

testpaths = tests/unit tests/integration
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Performance tests are excluded from the default run: they are timing
# sensitive and slow. Run them explicitly with `pytest tests/performance`.

asyncio_mode = strict
asyncio_default_fixture_loop_scope = function

addopts =
    --strict-markers
    --strict-config
    -ra

# Later entries take precedence, so the broad ignore comes first: warnings
# from third-party packages are noise we cannot act on, but a deprecation
# raised by our own code is a defect and fails the run.
filterwarnings =
    ignore::DeprecationWarning
    error::DeprecationWarning:app.*
    error::DeprecationWarning:src.*
